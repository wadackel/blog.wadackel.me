name: Pinact

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pinact
        uses: suzuki-shunsuke/pinact-action@v3.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
